name: Build & Deploy auf Strato

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: React App bauen
        working-directory: frontend
        run: ./node_modules/.bin/craco build

      - name: Auf Strato deployen via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 53357779.ssh.w1.strato.hosting
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: frontend/build/
          server-dir: /kgvgruenerwinkel/
          exclude: |
            **/.git*
            **/.git*/**
