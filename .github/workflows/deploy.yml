name: Build & Deploy auf Strato

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: React App bauen
        working-directory: frontend
        run: ./node_modules/.bin/craco build

      - name: Auf Strato deployen via SFTP
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: 53357779.ssh.w1.strato.hosting
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          uploads: |
            + frontend/build/ => kgvgruenerwinkel/
          delete: true
